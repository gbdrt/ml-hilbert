[pytest]
# Pytest configuration for ml-hilbert

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode for async tests
asyncio_mode = auto

# Markers
markers =
    requires_server: Tests that require a running petanque server (pet-server -p 8765)

# Output options
addopts =
    -v
    --strict-markers
    --tb=short

# Test paths
testpaths = tests
